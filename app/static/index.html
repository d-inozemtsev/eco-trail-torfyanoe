<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F7F8" />
    <meta
      name="description"
      content="Пять научных приключений у озера Торфяное в районе Патрокла: наблюдай, исследуй и найди свой характер озера."

      id="telegram-sdk"
